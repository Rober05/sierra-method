# oml-code settings
oml-code:
  schemaVersion: 1

# Project settings for Sierra Method
project:
  name: "@modelware/sierra-method"
  version: 0.2.0
  title: Sierra Modeling Method
  description: The Sierra modeling method

# source folders
sources:
  - src

# oml server settings
#server:
#  port: 8080

# Only include reusable method assets in src/method (excluding Fire Force src/model)
pack:
  include:
    - src/method
  exclude:
    - "**/*.test.oml"

# oml-cli parameter defaults
defaults:
  export: -o build/owl
  reason: -o build/owl -t
  render: -m src/model/md -b build/web -c src/model/oml/fireforce6.github.io/mission-control/bundle.oml
